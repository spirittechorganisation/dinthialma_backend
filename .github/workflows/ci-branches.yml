# ===================================================================
# Dinthialma Backend – CI branches de développement
# ===================================================================
#
# Déclenché sur : feature/*, hotfix/*, bugfix/*
# Stages        : Format → Compile & Test
# ❌ Pas de build Docker Hub
# ❌ Pas de déploiement VPS
#
# But : vérifier la qualité du code avant la PR (fail fast)
# ===================================================================

name: CI – Branch Check

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'bugfix/**'
    paths-ignore:
      - '**.md'
      - 'docker/grafana/**'
      - '.gitignore'
      - 'mvp'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docker/grafana/**'
      - '.gitignore'
      - 'mvp'

jobs:

  # ═══════════════════════════════════════════════════════════════
  # STAGE 0 – Google Java Format Check
  # ═══════════════════════════════════════════════════════════════
  format-check:
    name: Stage 0 – Google Java Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Google Java Format
        run: |
          chmod +x mvnw
          ./mvnw fmt:check -B --no-transfer-progress

      - name: Hint en cas d'échec
        if: failure()
        run: |
          echo "Format non conforme. Corrigez localement avec :"
          echo "   ./mvnw fmt:apply"

  # ═══════════════════════════════════════════════════════════════
  # STAGE 1 – Compile & Tests unitaires
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Stage 1 – Compile & Test
    runs-on: ubuntu-latest
    needs: format-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Tests unitaires + seuil JaCoCo (90 % / 80 % couche service).
      # Les tests d'intégration (*IT, Docker) ne tournent qu'en local : -DskipITs.
      - name: Compile & run unit tests
        run: |
          chmod +x mvnw
          ./mvnw verify -DskipITs -B --no-transfer-progress

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # Sondes des actions de déploiement (aucune n'est exécutée)
  # ═══════════════════════════════════════════════════════════════
  # docker-publish.yml ne tourne qu'au push sur main : une action refusée par la règle
  # de l'organisation n'y apparaîtrait qu'après le merge (incident frontend #41, 18/11).
  # Le runner télécharge ces actions au démarrage du job, même avec `if: false` :
  # une action non autorisée ou une référence invalide fait échouer la PR, pas le déploiement.
  # Garder les MÊMES SHA que docker-publish.yml.
  sondes-deploiement:
    name: Sondes – actions de déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sonde – setup-buildx (non exécutée)
        if: ${{ false }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sonde – login Docker Hub (non exécutée)
        if: ${{ false }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0

      - name: Sonde – metadata (non exécutée)
        if: ${{ false }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      - name: Sonde – build-push (non exécutée)
        if: ${{ false }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2

      - name: Sonde – déploiement SSH (non exécutée)
        if: ${{ false }}
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0

      - name: Actions de déploiement autorisées
        run: echo "Toutes les actions de docker-publish.yml sont autorisées et résolues."
